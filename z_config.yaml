model:
  clip_model_path: save/finetune_clip_all__layers/model000450000.pt ## 这个全finetune的是loss最小的，就先用这个
  clip_use_sen_emb: True  ## 这个加了发现是很有用的，之后就用这个
  use_avg_clip_model: True

training:
  use_gt_MB_simplified_data: True  ## 这个是是否直接使用gt的motion token来跑
  use_multiview_training: False
  split_info_injection: False ## 如果这个为False，下面的那个split_info_version参数就不会被用到
  split_info_version: 2

data:
  MB_simplified_data_path: /data/mengqing/HumanML3D_MB_rep_new
